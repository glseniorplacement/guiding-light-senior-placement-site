backend:
  name: github
  repo: glseniorplacement/guiding-light-senior-placement-site
  branch: main
  # OAuth proxy on the existing Vercel project
  base_url: https://gl-form-api.vercel.app
  auth_endpoint: api/auth

# Save an in-progress draft as a PR before publishing
publish_mode: editorial_workflow

# Where uploaded images go
media_folder: "assets/blog"
public_folder: "/assets/blog"

# Content collections
collections:
  - name: "posts"
    label: "Blog Posts"
    label_singular: "Blog Post"
    folder: "_posts"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    preview_path: "blog/{{slug}}"
    editor:
      preview: false
    fields:
      - { label: "Layout", name: "layout", widget: "hidden", default: "post" }
      - { label: "Title", name: "title", widget: "string", hint: "The headline of the post" }
      - { label: "Publish Date", name: "date", widget: "datetime" }
      - {
          label: "Author",
          name: "author",
          widget: "select",
          options: ["Israel & Norma Villaseñor", "Israel Villaseñor", "Norma Villaseñor"],
          default: "Israel & Norma Villaseñor"
        }
      - {
          label: "Category",
          name: "category",
          widget: "select",
          options: ["Family", "Placement Tips", "Assisted Living", "Residential Care", "Medi-Cal & Costs", "Stories"],
          default: "Family"
        }
      - {
          label: "Short Description",
          name: "excerpt",
          widget: "text",
          hint: "1-2 sentence summary for the blog list page and social media previews"
        }
      - {
          label: "Featured Image",
          name: "image",
          widget: "image",
          required: false,
          hint: "Large photo shown at the top of the post"
        }
      - { label: "Body", name: "body", widget: "markdown" }
