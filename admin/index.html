<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Content Manager — Guiding Light</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex,nofollow">
  <style>
    /* Simple loading state while Decap boots */
    .loading-screen {
      position: fixed; inset: 0; background: #fdf9ee; color: #a07c2c;
      display: flex; align-items: center; justify-content: center;
      font-family: -apple-system, system-ui, sans-serif; font-size: 18px;
      z-index: 999;
    }
    .loading-screen::before {
      content: ""; width: 40px; height: 40px; border: 3px solid #e6cc8a;
      border-top-color: #c9a24a; border-radius: 50%;
      animation: spin 0.8s linear infinite; margin-right: 14px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
  <script>
    // Hide loading screen once Decap CMS renders its UI
    (function() {
      var check = setInterval(function() {
        var root = document.getElementById('nc-root');
        if (root && root.childElementCount > 0) {
          var ls = document.querySelector('.loading-screen');
          if (ls) ls.remove();
          clearInterval(check);
        }
      }, 150);
    })();
  </script>
</head>
<body>
  <div class="loading-screen">Loading content manager…</div>

  <!-- Decap CMS -->
  <script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>
</body>
</html>
